<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Học và luyện IELTS Writing Task 1 dạng biểu đồ xu hướng. Chạy offline, giao diện tiếng Việt.">

  <!-- Khung nhìn: khoá phóng to, chừa vùng tai thỏ trên iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2F6BFF">

  <!-- iOS: cho phép thêm vào màn hình chính và chạy toàn màn hình -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Task 1 Coach">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Task 1 Coach — IELTS Writing Task 1</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#F7F8FC; }
    @media (prefers-color-scheme: dark) { html, body { background:#111318; } }
    #boot { position:fixed; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:18px;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            color:#5A6478; transition:opacity .3s; }
    #boot .ring { width:44px; height:44px; border:4px solid #D8DEEA;
                  border-top-color:#2F6BFF; border-radius:50%;
                  animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
  <div id="boot"><div class="ring"></div><div>Đang tải Task 1 Coach…</div></div>
  <script>
    // Ẩn màn hình chờ khi Flutter đã vẽ khung đầu tiên.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function(){ b.remove(); }, 320); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Service worker riêng của app: cache toàn bộ tài nguyên để lần sau mở
    // được cả khi mất mạng. Flutter đã bỏ service worker của họ từ 3.4x.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Không đăng ký được service worker:', e);
        });
      });
    }
  </script>
</body>
</html>
